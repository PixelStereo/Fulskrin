name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The test media, made once with Ubuntu's ffmpeg program (it has every encoder the tests need: x264, HAP…) and
  # handed to the three platforms
  media:
    name: Test media
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Make
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sh test/make_media.sh
      - uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: test/media
          retention-days: 1

  linux:
    name: Linux (Ubuntu 24.04) + tests
    runs-on: ubuntu-24.04
    needs: media
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/ (shallow, pinned commits)
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libqt6opengl6-dev qt6-multimedia-dev \
            libgl1-mesa-dev libgl1-mesa-dri libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev \
            libasound2-dev ffmpeg xvfb
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          cmake --build build --target fulskrin_tests -j4
      - name: Engine tests
        run: |
          xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Package Linux archive
        run: |
          mkdir -p dist
          install -Dm755 build/Fulskrin dist/Fulskrin
          cp -R build/isf dist/isf
          cat > dist/README-Linux.txt <<'EOF'
          Fulskrin Linux x86_64 — runtime requirements

          This archive is built on Ubuntu 24.04 and is not a fully self-contained AppImage.
          On Ubuntu 24.04, install the runtime libraries with:
            sudo apt install libqt6widgets6 libqt6openglwidgets6 libqt6opengl6 libqt6multimedia6 qt6-qpa-plugins libgl1 libasound2t64 libavformat60 libavcodec60 libswscale7 libswresample4 libavutil58

          Extract the archive and run ./Fulskrin from this directory so the adjacent ./isf shaders can be found.
          Other Linux distributions may require equivalent runtime packages.
          EOF
          tar -C dist -czf Fulskrin-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Fulskrin-linux
          path: Fulskrin-linux-x86_64.tar.gz

  # The HAP and Snappy readers against damaged files: a short libFuzzer run with ASan / UBSan, seeded with the
  # HAP frames of the test media (test/fuzz_hap.cpp). A crash fails the job and its input is kept as an artifact.
  fuzz:
    name: Fuzzing (HAP, Snappy)
    runs-on: ubuntu-24.04
    needs: media
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config clang-18 libclang-rt-18-dev qt6-base-dev libqt6opengl6-dev \
            qt6-multimedia-dev libgl1-mesa-dev libavformat-dev libavcodec-dev libswscale-dev libswresample-dev \
            libavutil-dev ffmpeg
      - name: Build
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DFULSKRIN_FUZZ=ON
          cmake --build build-fuzz --target fuzz_hap -j4
      - name: Fuzz (2 minutes)
        run: |
          sh test/make_fuzz_corpus.sh "$PWD/fuzz_corpus"
          mkdir -p fuzz_crashes
          ./build-fuzz/fuzz_hap -fork=4 -max_total_time=120 -rss_limit_mb=4096 -artifact_prefix=fuzz_crashes/ fuzz_corpus
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz_crashes

  macos:
    name: macOS (Apple Silicon) + tests
    runs-on: macos-14
    needs: media
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/ (shallow, pinned commits)
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      - name: Dependencies
        run: brew install qt ffmpeg pkg-config
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build -j4
          cmake --build build --target fulskrin_tests -j4
      - name: Engine tests
        run: |
          ctest --test-dir build --output-on-failure
      - name: Package .app
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/Fulskrin.app
          ditto -c -k --keepParent build/Fulskrin.app Fulskrin-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fulskrin-macos
          path: Fulskrin-macos.zip

  windows:
    name: Windows (MSVC 2022) + tests
    runs-on: windows-2022
    needs: media
    env:
      FFMPEG_ZIP: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/ (shallow, pinned commits)
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true
      - name: FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_ZIP.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="C:\ffmpeg\$env:FFMPEG_ZIP"
          cmake --build build
          cmake --build build --target fulskrin_tests
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: test/media
      # No GPU on the runner: Mesa's software OpenGL (llvmpipe, OpenGL 4.5)
      - uses: ssciwr/setup-mesa-dist-win@v2
      - name: Engine tests
        shell: pwsh
        env:
          LP_NUM_THREADS: '1' # the software GPU on one core: the sound's threads keep their time
        run: |
          $env:PATH = "C:\ffmpeg\$env:FFMPEG_ZIP\bin;$env:PATH"
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\Fulskrin.exe, build\*.dll dist\
          Copy-Item -Recurse build\isf dist\isf
          windeployqt --release dist\Fulskrin.exe
          Compress-Archive -Path dist\* -DestinationPath Fulskrin-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fulskrin-windows
          path: Fulskrin-windows.zip


  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fulskrin ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
